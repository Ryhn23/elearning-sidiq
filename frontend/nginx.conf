server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    client_max_body_size 500M;

    # Security Headers
    #
    # CSP: mitigasi XSS terakhir. Catatan konfigurasi:
    # - script-src 'self': semua script Vite dari file ter-hash /assets/*.js (tanpa inline).
    # - style-src 'unsafe-inline': diperlukan — konten TipTap (sanitasi DOMPurify) memakai
    #   atribut style inline (border blockquote, dsb) dan React set style runtime.
    # - img-src data: + https:: gambar bisa base64 (TipTap) atau URL eksternal dari konten
    #   pengajar. object-src 'none' + frame-src 'none': tidak ada object/iframe di app.
    # - upgrade-insecure-requests: produksi harus HTTPS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Kompresi on-the-fly (brotli tidak tersedia di nginx open-source)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    # Aset dengan hash di nama → cache permanen (immutable)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 365d;
        access_log off;
    }

    # HTML SPA: selalu cek versi terbaru
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy untuk streaming video, file materi, dan sertifikat PDF
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_force_ranges on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
