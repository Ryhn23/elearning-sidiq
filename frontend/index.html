<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sidiq E-Learning: Platform pembelajaran daring santri terintegrasi dengan SIDIQ ERP." />
    <meta name="theme-color" content="#00a417" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.content = t === 'system' ? 'light dark' : t;
        } catch(e) {}
      })();
    </script>
    <meta property="og:title" content="Sidiq E-Learning" />
    <meta property="og:description" content="Platform pembelajaran daring santri terintegrasi dengan SIDIQ ERP." />
    <meta property="og:type" content="website" />
    <title>Sidiq E-Learning — Platform Pembelajaran Pesantren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
